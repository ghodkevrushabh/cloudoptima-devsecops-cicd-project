services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudoptima-postgres
    env_file:
      - ./config/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudoptima-flask
    env_file:
      - ./config/.env
    environment:
      GENERATED_BASE_DIR: /app/generated
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./generated:/app/generated
    restart: unless-stopped

volumes:
  pgdata:
