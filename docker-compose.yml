services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudoptima-postgres
    env_file:
      - ./config/.env
    ports:
      # Binding strictly to 127.0.0.1 for security
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
